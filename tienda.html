<!doctype html>
<html lang="es-PA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tienda — Aera Selfcare</title>
  <meta name="theme-color" content="#fbefef">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo-plum.png">
  <link rel="stylesheet" href="assets/css/base.css?v=8">
  <link rel="stylesheet" href="assets/css/store.css?v=8">
  <script src="assets/js/catalog.js?v=8" defer></script>
  <script src="assets/js/aera.js?v=8" defer></script>
  <script src="assets/js/store.js?v=8" defer></script>
</head>
<body data-page="tienda">
  <p class="demo-note">Boceto para revisión<span class="long"> · al probar un pedido se abre WhatsApp, pero nada se envía hasta que tú presiones enviar</span></p>
  <header id="site-header"></header>
  <main>
    <section class="aisle-head" aria-labelledby="t-title">
      <div class="wrap">
        <div>
          <h1 class="h-sign" id="t-title">La tienda</h1>
          <p class="lede">Todo nuestro estante, ordenado por pasillo según lo que necesita tu cabello y tu piel.</p>
        </div>
        <div class="searchbox" id="buscar">
          <label class="visually-hidden" for="search">Buscar productos</label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input class="input" id="search" type="search" placeholder="Busca por producto, marca o necesidad" autocomplete="off">
        </div>
      </div>
    </section>
    <nav class="aisle-tabs" aria-label="Pasillos"><div class="wrap" id="aisleTabs"></div></nav>
    <div class="wrap">
      <div class="toolbar">
        <span class="count" id="resultCount" aria-live="polite"></span>
        <label><span class="visually-hidden">Ordenar</span>
          <select class="select" id="sort">
            <option value="featured">Destacados primero</option>
            <option value="price-asc">Menor precio</option>
            <option value="price-desc">Mayor precio</option>
            <option value="name">Nombre A–Z</option>
          </select>
        </label>
      </div>
      <div id="aisleShelves" style="display:grid;gap:clamp(26px,4vw,40px);padding:8px 0 clamp(60px,8vw,100px)"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
